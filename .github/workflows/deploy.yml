name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "API/portal image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/eid-cloud
            export API_TAG="${{ inputs.image_tag }}"
            export PORTAL_TAG="${{ inputs.image_tag }}"
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env pull
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --remove-orphans
            docker image prune -f
